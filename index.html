<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DogLife ID</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #000;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;

            text-align: center;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 34px;
            font-weight: 800;

            margin: 0 0 10px;
        }

        .subtitle {
            color: #999;

            font-size: 17px;

            margin-bottom: 35px;
        }

        .info {
            background: #1c1c1e;

            border-radius: 24px;

            padding: 25px 20px;
        }

        .label {
            color: #999;

            font-size: 15px;

            line-height: 1.5;

            margin-bottom: 10px;
        }

        .id {
            font-size: 30px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 25px;

            word-break: break-word;
        }

        .status {
            color: #30d158;

            font-size: 17px;

            font-weight: 600;

            margin-bottom: 20px;
        }

        .install-message {
            margin-top: 20px;

            padding: 16px;

            background: #2c2c2e;

            border-radius: 16px;

            color: #f2f2f7;

            font-size: 16px;

            line-height: 1.5;
        }

        .footer {
            margin-top: 20px;

            color: #666;

            font-size: 13px;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="logo">
        🐶
    </div>


    <h1>
        DogLife
    </h1>


    <div class="subtitle">
        Информация о питомце
    </div>


    <div class="info">

        <div class="label">
            DogLife ID
        </div>


        <div
            class="id"
            id="dogID"
        >
            Загрузка...
        </div>


        <div class="status">
            ✓ Профиль зарегистрирован
        </div>


        <div class="label">
            Этот QR-код связан с профилем питомца
            в DogLife.
        </div>


        <div class="install-message">

            📱 Чтобы открыть полный профиль питомца,
            установите приложение DogLife из App Store.

        </div>

    </div>


    <div class="footer">
        DogLife · Всё важное о вашем питомце
    </div>

</div>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );


    const dogID =
        params.get("id");


    const dogIDElement =
        document.getElementById("dogID");


    if (dogID) {

        dogIDElement.textContent =
            dogID;

    } else {

        dogIDElement.textContent =
            "ID не указан";

    }

</script>


</body>

</html>
